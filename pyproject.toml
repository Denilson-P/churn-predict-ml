
[project]
name = "churn-predict-ml"
version = "0.1.0"
description = "Machine Learning project for customer churn prediction using Python, Scikit-learn, FastAPI, and Docker."
authors = [
    {name = "Denilson Paiva", email = "denilsonsantos00@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas (>=3.1.1,<4.0.0)",
    "numpy (>=2.5.5,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)"
]


[tool.poetry]
package-mode = false


[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.6,<0.18.0)"
]


[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
